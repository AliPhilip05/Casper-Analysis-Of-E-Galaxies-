name: Deploy CAS dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/aphlip.org/**"
      - "frontend/index.html"
      - "frontend/styles.css"
      - "frontend/app.js"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        run: |
          mkdir -p _site/portfolio _site/casper
          cp frontend/index.html frontend/styles.css frontend/app.js _site/
          cp -R frontend/aphlip.org/. _site/portfolio/
          rm -f _site/portfolio/README.md
          touch _site/.nojekyll
          python3 - <<'PYCODE'
          from pathlib import Path

          # Preserve old dashboard links while publishing it at the site root.
          Path("_site/casper/index.html").write_text(
              '<!doctype html><html lang="en"><head><meta charset="utf-8">'
              '<meta name="viewport" content="width=device-width, initial-scale=1">'
              '<meta http-equiv="refresh" content="0; url=../">'
              '<link rel="canonical" href="../">'
              '<title>CAS / E+A</title></head>'
              '<body><p><a href="../">Open the CAS / E+A dashboard</a></p></body></html>\n'
          )
          PYCODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
