name: Deploy APhlip.org to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/aphlip.org/**"
      - "frontend/index.html"
      - "frontend/styles.css"
      - "frontend/app.js"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        run: |
          mkdir -p _site/casper
          cp -R frontend/aphlip.org/. _site/
          rm -f _site/README.md
          cp frontend/index.html frontend/styles.css frontend/app.js _site/casper/
          touch _site/.nojekyll
          python3 - <<'PY'
          from pathlib import Path

          # The source site sits beside the dashboard in the repository. On Pages,
          # the personal site is deployed at the root and the dashboard at /casper/.
          for page in (Path("_site/research.html"), Path("_site/index.html")):
              content = page.read_text()
              page.write_text(content.replace('href="../index.html"', 'href="casper/"'))
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
